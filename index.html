<title>Farmin Visual — Penjana Quotation & Invoice</title>
<style>
:root{--g:#1f5d3a;--ink:#1a1a1a;--mut:#777;--line:#e3e3e3}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f1f1ef}
.wrap{display:grid;grid-template-columns:380px 1fr;gap:20px;padding:20px;max-width:1300px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px #0001;align-self:start}
.panel h2{margin:0 0 10px;font-size:16px;color:var(--g)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.item{display:grid;grid-template-columns:1fr 90px 30px;gap:6px;margin-bottom:6px}
button{cursor:pointer;border:0;border-radius:6px;padding:9px 12px;font-size:14px}
.pri{background:var(--g);color:#fff;width:100%;margin-top:14px;font-weight:bold}
.sec{background:#eee;margin-top:6px}
.x{background:#fbe9e9;color:#b00;padding:6px}
.seg{display:flex;gap:6px}.seg button{flex:1;background:#eee}.seg button.on{background:var(--g);color:#fff}
.sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;padding:14mm;box-shadow:0 1px 6px #0002;font-size:13px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px}
.brand{display:flex;gap:16px;align-items:center}
.brand img{width:88px;height:88px;object-fit:contain}
.brand h1{margin:0;font-size:28px}.brand small{color:var(--mut)}
.doc{text-align:right;color:var(--mut);font-size:12px;line-height:1.6}.doc b{display:block;font-size:24px;color:var(--ink)}
.cols{display:flex;gap:30px;margin:22px 0}.cols>div{flex:1}
.cap{font-size:11px;font-weight:bold;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
.sm{color:var(--mut);font-size:12px;line-height:1.6}
table{width:100%;border-collapse:collapse}
th{background:#1a1a1a;color:#fff;text-align:left;padding:10px;font-size:13px}
th:last-child,td:last-child{text-align:right}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tot td{border:0;padding:6px 10px}
.tot .big{font-weight:bold;font-size:16px;border-top:1px solid #000}
.pay{margin-top:26px;line-height:1.6}
@media print{
 body{background:#fff}.wrap{display:block;padding:0}.panel{display:none}
 .sheet{box-shadow:none;width:auto;min-height:0;padding:0}
 th{background:#1a1a1a!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="panel" id="form">
  <h2>Penjana Dokumen</h2>
  <div class="seg"><button id="tQ" type="button">Quotation</button><button id="tI" type="button" class="on">Invoice</button></div>
  <div class="row"><div><label>No. dokumen</label><input id="no"></div><div><label>Tarikh</label><input id="tarikh" type="date"></div></div>
  <div id="rujWrap"><label>Rujukan quotation</label><input id="ruj" placeholder="FV-2026-0003"></div>
  <label>Nama pelanggan</label><input id="nama">
  <label>No. telefon</label><input id="tel">
  <label>Pakej</label><select id="pakejSel"></select><input id="pakej" placeholder="Taip nama pakej" style="display:none;margin-top:6px">
  <div id="paxWrap" style="display:none"><label>Bilangan orang</label><input id="pax" type="number" min="1" value="2"></div>
  <div class="row"><div><label>Tempoh</label><input id="tempoh" value="1 jam"></div><div><label>Tarikh sesi</label><input id="slot" type="date"></div></div>
  <div class="row"><div><label>Waktu</label><input id="waktu" value="6 petang"></div><div><label>Slot</label><select id="slotw"><option>Pagi</option><option selected>Petang</option><option>Malam</option></select></div></div>
  <label>Lokasi</label><input id="lokasi">
  <label>Harga pakej (RM)</label><input id="harga" type="number" step="0.01" value="120">
  <label>Item tambahan (cth. Pengangkutan)</label>
  <div id="items"></div>
  <button class="sec" type="button" id="add">+ Tambah item</button>
  <div id="quick"></div>
  <label>Deposit (RM)</label><input id="dep" type="number" step="0.01" value="50">
  <button class="pri" type="button" id="print">Cetak / Simpan PDF</button>
  <button class="sec" type="button" id="reset" style="width:100%">Dokumen baru</button>
 </div>
 <div class="sheet" id="sheet"></div>
</div>

/* ========================================= */

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rm=n=>(+n||0).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const hari=["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];
let jenis="I";

function fmt(d){if(!d)return"";const[y,m,j]=d.split("-");return j+"/"+m+"/"+y}
function hariDari(d){if(!d)return"";return hari[new Date(d+"T00:00:00").getDay()]}

function counter(){
 const y=new Date().getFullYear();
 let c={};try{c=JSON.parse(localStorage.getItem("fv_counter")||"{}")}catch(e){}
 return {y,n:(c[jenis+y]||0)+1,c};
}
function setNo(){
 const{y,n}=counter();
 $("no").value=(jenis==="Q"?TETAPAN.prefixQ:TETAPAN.prefixI)+y+"-"+String(n).padStart(4,"0");
}
function simpanCounter(){
 const{y,n,c}=counter();c[jenis+y]=n;
 try{localStorage.setItem("fv_counter",JSON.stringify(c))}catch(e){}
}
function setJenis(j){
 jenis=j;
 $("tQ").className=j==="Q"?"on":"";$("tI").className=j==="I"?"on":"";
 $("rujWrap").style.display=j==="I"?"block":"none";
 setNo();render();
}
function addItem(nama,harga){
 const d=document.createElement("div");d.className="item";
 d.innerHTML='<input placeholder="Perkara"><input type="number" step="0.01" placeholder="RM"><button class="x" type="button">×</button>';
 d.children[0].value=nama||"";d.children[1].value=harga||"";
 d.children[2].onclick=()=>{d.remove();render()};
 d.oninput=render;$("items").appendChild(d);
}
function items(){
 return[...document.querySelectorAll("#items .item")].map(d=>({n:d.children[0].value,h:+d.children[1].value||0})).filter(i=>i.n||i.h);
}
function render(){
 const Q=jenis==="Q",tajuk=Q?"QUOTATION":"INVOICE";
 const ex=items(),harga=+$("harga").value||0,dep=+$("dep").value||0;
 const jumlah=harga+ex.reduce((a,i)=>a+i.h,0),baki=jumlah-dep;
 const slot=$("slot").value,sd=slot?fmt(slot)+" ("+hariDari(slot)+") · "+$("slotw").value:"";
 const butir=[$("tempoh").value,sd&&"Slot: "+sd,$("waktu").value&&"Waktu: "+$("waktu").value,$("lokasi").value&&"Lokasi: "+$("lokasi").value].filter(Boolean);
 $("sheet").innerHTML=
 '<div class="head"><div class="brand"><img src="'+esc(TETAPAN.logo)+'" alt="" onerror="this.style.display=\'none\'"><div><h1>'+esc(TETAPAN.syarikat)+'</h1><small>'+esc(TETAPAN.admin)+'</small></div></div>'+
 '<div class="doc"><b>'+tajuk+'</b>No: '+esc($("no").value)+'<br>Tarikh: '+esc(fmt($("tarikh").value))+(!Q&&$("ruj").value?'<br>Rujukan quotation: '+esc($("ruj").value):'')+'</div></div>'+
 '<div class="cols"><div><div class="cap">Kepada</div><div>'+esc($("nama").value)+'</div><div class="sm">'+esc($("tel").value)+'</div></div>'+
 '<div><div class="cap">Butiran sesi</div><div>'+esc($("pakej").value)+'</div><div class="sm">'+butir.map(esc).join("<br>")+'</div></div></div>'+
 '<table><tr><th>Perkara</th><th>Butiran</th><th>Jumlah (RM)</th></tr>'+
 '<tr><td>'+esc("Pakej "+$("pakej").value)+'</td><td class="sm">'+butir.map(esc).join("<br>")+'</td><td>'+rm(harga)+'</td></tr>'+
 ex.map(i=>'<tr><td>'+esc(i.n)+'</td><td></td><td>'+rm(i.h)+'</td></tr>').join("")+'</table>'+
 '<table class="tot"><tr><td></td><td style="text-align:right">Jumlah</td><td style="width:120px">RM '+rm(jumlah)+'</td></tr>'+
 (dep?'<tr><td></td><td style="text-align:right">'+(Q?'Tolak: Deposit (perlu dibayar untuk tempah)':'Tolak: Deposit (telah dibayar)')+'</td><td>- RM '+rm(dep)+'</td></tr>':'')+
 '<tr><td></td><td class="big" style="text-align:right">'+(Q?'BAKI SELEPAS DEPOSIT':'JUMLAH PERLU DIBAYAR')+'</td><td class="big">RM '+rm(baki)+'</td></tr></table>'+
 '<div class="pay"><div class="cap">Maklumat bayaran</div>'+esc(TETAPAN.bank)+'<br>No Akaun: '+esc(TETAPAN.akaun)+'<br>Nama: '+esc(TETAPAN.namaAkaun)+'</div>';
}
function initPakej(){
 $("pakejSel").innerHTML=TETAPAN.pakej.map((p,i)=>'<option value="'+i+'">'+esc(p.k+" — "+p.nama)+' — RM '+rm(p.harga)+(p.kepala?'/orang':'')+'</option>').join("")+'<option value="x">Lain-lain (taip sendiri)</option>';
 $("pakejSel").onchange=()=>pilihPakej(true);
 $("pax").oninput=()=>pilihPakej(false);
 $("quick").innerHTML="";
 TETAPAN.tambahan.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="sec";b.style.cssText="width:100%;text-align:left";b.textContent="+ "+t.n+" (RM "+rm(t.h)+")";b.onclick=()=>{addItem(t.n,t.h);render()};$("quick").appendChild(b)});
 pilihPakej(false);
}
function pilihPakej(fokus){
 const v=$("pakejSel").value,L=v==="x",p=L?null:TETAPAN.pakej[+v];
 $("pakej").style.display=L?"block":"none";
 $("paxWrap").style.display=p&&p.kepala?"block":"none";
 if(L){$("pakej").value="";if(fokus)$("pakej").focus()}
 else{
  const n=p.kepala?Math.max(1,+$("pax").value||1):1;
  $("pakej").value=p.k+" — "+p.nama+(p.kepala?" × "+n+" orang":"");
  $("tempoh").value="1 jam";$("harga").value=p.harga*n;
 }
 render();
}
function baru(){
 simpanCounter();
 ["nama","tel","ruj","lokasi","slot"].forEach(i=>$(i).value="");
 $("items").innerHTML="";addItem("Pengangkutan",25);
 $("tarikh").valueAsDate=new Date();setNo();render();
}
$("tQ").onclick=()=>setJenis("Q");$("tI").onclick=()=>setJenis("I");
$("add").onclick=()=>addItem();
$("print").onclick=()=>{simpanCounter();document.title=$("no").value+" - "+($("nama").value||"Pelanggan");window.print()};
$("reset").onclick=baru;
$("form").addEventListener("input",render);
$("tarikh").valueAsDate=new Date();
addItem("Pengangkutan",25);setNo();initPakej();
</script>
